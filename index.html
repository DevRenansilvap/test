<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rota+</title>
<meta name="theme-color" content="#0e1318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rota+">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#0e1318;
    --bg-grad-a:#0c2b2e;
    --bg-grad-b:#0e1318;
    --card:#171d24;
    --card-2:#1c232b;
    --border:#252d36;
    --text:#f2f5f7;
    --muted:#8b96a3;
    --muted-2:#5f6b78;
    --accent:#2dd4c4;
    --accent-dark:#1ea89b;
    --accent-soft:rgba(45,212,196,0.14);
    --green:#3ecf7a;
    --red:#ef5b5b;
    --purple:#b98af0;
    --purple-soft:rgba(185,138,240,0.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior-y:none;
  }
  #root{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(120% 60% at 50% 0%, var(--bg-grad-a) 0%, var(--bg-grad-b) 55%);
    position:relative;
  }
  .status-spacer{ height:env(safe-area-inset-top,0px); }
  header.topbar{
    padding:18px 20px 6px 20px;
  }
  header.topbar h1{
    font-size:22px;
    font-weight:700;
    margin:0 0 2px 0;
    letter-spacing:-0.02em;
  }
  header.topbar p.sub{
    margin:0;
    color:var(--muted);
    font-size:13.5px;
  }
  main{
    flex:1;
    padding:14px 16px 100px 16px;
    overflow-y:auto;
  }
  .actions-row{
    display:flex;
    gap:10px;
    margin:12px 0 16px 0;
  }
  .btn{
    border:none;
    border-radius:12px;
    padding:11px 14px;
    font-size:14.5px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:7px;
    cursor:pointer;
    font-family:inherit;
  }
  .btn-primary{
    background:var(--accent);
    color:#052322;
  }
  .btn-primary:active{background:var(--accent-dark);}
  .btn-secondary{
    background:var(--card-2);
    color:var(--text);
    border:1px solid var(--border);
  }
  .btn-block{ width:100%; justify-content:center; }
  .btn-ghost{
    background:transparent;
    color:var(--accent);
    border:1px solid var(--border);
  }
  .btn-danger-outline{
    background:transparent;
    color:var(--red);
    border:1px solid var(--border);
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    margin-bottom:12px;
  }
  .card .label{
    color:var(--muted);
    font-size:13px;
    margin-bottom:6px;
  }
  .card .value{
    font-size:24px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .card .hint{
    color:var(--muted-2);
    font-size:12.5px;
    margin-top:4px;
  }
  .section-title{
    font-size:17px;
    font-weight:700;
    margin:22px 0 10px 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .section-title .link{
    font-size:13px;
    color:var(--accent);
    font-weight:600;
  }
  .list-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 14px;
    border-bottom:1px solid var(--border);
  }
  .list-item:last-child{ border-bottom:none; }
  .icon-badge{
    width:34px;height:34px;
    border-radius:10px;
    background:var(--card-2);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    color:var(--muted);
  }
  .li-main{ flex:1; min-width:0; }
  .li-title{ font-size:14.5px; font-weight:600; }
  .li-sub{ font-size:12px; color:var(--muted); margin-top:2px; }
  .li-value{ font-size:14.5px; font-weight:700; white-space:nowrap; }
  .tag{
    font-size:11px;
    font-weight:600;
    padding:3px 8px;
    border-radius:20px;
    background:var(--purple-soft);
    color:var(--purple);
    margin-left:6px;
    white-space:nowrap;
  }
  .tag.green{ background:rgba(62,207,122,0.16); color:var(--green); }
  .tag.muted{ background:var(--card-2); color:var(--muted); }
  .empty{
    text-align:center;
    padding:28px 10px;
    color:var(--muted);
    font-size:13.5px;
  }
  .empty .emoji{ font-size:28px; display:block; margin-bottom:8px; }

  nav.tabbar{
    position:fixed;
    bottom:0;left:0;right:0;
    max-width:480px;
    margin:0 auto;
    background:rgba(14,19,24,0.88);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--border);
    display:flex;
    padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px)) 4px;
    z-index:40;
  }
  nav.tabbar button{
    flex:1;
    background:none;
    border:none;
    color:var(--muted-2);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    font-size:10.5px;
    font-family:inherit;
    padding:4px 0;
    cursor:pointer;
  }
  nav.tabbar button.active{ color:var(--accent); }
  nav.tabbar svg{ width:21px;height:21px; }

  .sheet-backdrop{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.55);
    z-index:50;
    display:flex;
    align-items:flex-end;
    opacity:0;pointer-events:none;
    transition:opacity 0.2s;
  }
  .sheet-backdrop.open{ opacity:1; pointer-events:auto; }
  .sheet{
    background:var(--card);
    border:1px solid var(--border);
    border-bottom:none;
    width:100%;
    max-width:480px;
    margin:0 auto;
    border-radius:20px 20px 0 0;
    padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px)) 20px;
    transform:translateY(100%);
    transition:transform 0.25s cubic-bezier(.2,.9,.3,1);
    max-height:88vh;
    overflow-y:auto;
  }
  .sheet-backdrop.open .sheet{ transform:translateY(0); }
  .sheet-handle{
    width:36px;height:4px;background:var(--border);
    border-radius:4px;margin:4px auto 14px auto;
  }
  .sheet-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:4px;
  }
  .sheet-head h3{ margin:0; font-size:17px; font-weight:700; }
  .sheet-head button.close{
    background:var(--card-2);
    border:none;color:var(--muted);
    width:28px;height:28px;border-radius:50%;
    font-size:15px;cursor:pointer;
  }
  .sheet p.desc{ color:var(--muted); font-size:13px; margin:2px 0 16px 0; }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;font-size:12.5px;font-weight:600;
    color:var(--muted);margin-bottom:6px;
  }
  .field input, .field select{
    width:100%;
    background:var(--card-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:10px;
    padding:11px 12px;
    font-size:15px;
    font-family:inherit;
  }
  .field input:focus, .field select:focus{
    outline:none;border-color:var(--accent);
  }
  .field-hint{
    font-size:11.5px;
    color:var(--muted-2);
    margin-top:5px;
    line-height:1.4;
  }
  .row2{ display:flex; gap:10px; }
  .row2 > *{ flex:1; }
  .toast{
    position:fixed;
    bottom:96px;left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--text);
    color:#0e1318;
    padding:11px 18px;
    border-radius:30px;
    font-size:13.5px;
    font-weight:600;
    z-index:60;
    opacity:0;
    transition:all 0.25s;
    pointer-events:none;
    display:flex;align-items:center;gap:8px;
    max-width:88%;
    white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .filter-row{
    display:flex;gap:8px;margin-bottom:12px;
  }
  .filter-chip{
    flex:1;text-align:center;
    background:var(--card-2);
    border:1px solid var(--border);
    color:var(--muted);
    border-radius:10px;
    padding:8px 0;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
  }
  .filter-chip.active{
    background:var(--accent-soft);
    color:var(--accent);
    border-color:var(--accent);
  }
  .mini-cards{ display:flex; gap:10px; }
  .mini-cards .card{ flex:1; padding:13px; }
  .mini-cards .value{ font-size:18px; }
  .swatch{
    width:36px;height:36px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);color:var(--accent);
    flex-shrink:0;
  }
  ::-webkit-scrollbar{ display:none; }
  .gear-btn{
    background:var(--card-2);
    border:1px solid var(--border);
    color:var(--muted);
    width:36px;height:36px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    cursor:pointer;
  }
  .gear-btn svg{ width:17px;height:17px; }
  .icon-btn-trash{
    background:none;
    border:none;
    color:var(--muted-2);
    padding:6px;
    margin-left:2px;
    cursor:pointer;
    flex-shrink:0;
    display:flex;
  }
  .icon-btn-trash svg{ width:16px;height:16px; }
  .icon-btn-trash:active{ color:var(--red); }
</style>
</head>
<body>
<div id="root"></div>

<script>
// ---------- Icons ----------
const ICONS = {

  plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,

  shield: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 4.5 3 7.5 8 9 5-1.5 8-4.5 8-9V6l-8-3Z"/></svg>`,

// ---------- Storage ----------
const STORAGE_KEY = "rotaplus-data-v1";
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    turnos: [],
    despesasOperacionais: [],
    contasFixas: [],
    gastosPessoais: [],
    aportes: [],
    config: { sheetsUrl: '', lastSync: null }
  };
}
let DATA = loadData();
function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

// ---------- Helpers ----------
function brl(n){
  n = Number(n)||0;
  return "R$ " + n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function todayISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function fmtDate(iso){
  if(!iso) return "";
  const [y,m,d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
function fmtTime(iso){
  if(!iso) return "";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "";
  return d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}
function toDatetimeLocal(iso){
  if(!iso) return "";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "";
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
// Computes real earnings for a turno, supporting both the new "accumulated value"
// schema (uberAcumInicio/Fim, noventaNoveAcumInicio/Fim) and legacy turnos that
// stored a direct ganho value (t.uber, t.noventaenove).
function turnoGanhos(t){
  let uber, noventaenove;
  if(t.uberAcumFim!=null){
    uber = t.uberAcumInicio!=null ? Math.max(0, Number(t.uberAcumFim)-Number(t.uberAcumInicio)) : Number(t.uberAcumFim);
  } else {
    uber = Number(t.uber||0);
  }
  if(t.noventaNoveAcumFim!=null){
    noventaenove = t.noventaNoveAcumInicio!=null ? Math.max(0, Number(t.noventaNoveAcumFim)-Number(t.noventaNoveAcumInicio)) : Number(t.noventaNoveAcumFim);
  } else {
    noventaenove = Number(t.noventaenove||0);
  }
  const pix = Number(t.pix||0);
  return {uber, noventaenove, pix, total: uber+noventaenove+pix};
}
function isThisMonth(iso){
  if(!iso) return false;
  const d = new Date(iso+"T00:00:00");
  const now = new Date();
  return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
}
function monthLabel(){
  const now = new Date();
  return now.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
}
function formatDuration(ms){
  if(ms<=0) return '0min';
  const totalMin = Math.round(ms/60000);
  const h = Math.floor(totalMin/60);
  const m = totalMin%60;
  return (h>0? h+'h ':'') + m + 'min';
}

// ---------- Google Sheets sync ----------
function maybeSync(){
  if(DATA.config && DATA.config.sheetsUrl) syncToSheets(true);
}
async function syncToSheets(silent){
  const cfg = DATA.config||{};
  if(!cfg.sheetsUrl){ if(!silent) showToast('Configure a URL primeiro'); return; }
  try{
    await fetch(cfg.sheetsUrl, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({
        turnos: DATA.turnos,
        despesasOperacionais: DATA.despesasOperacionais,
        contasFixas: DATA.contasFixas,
        gastosPessoais: DATA.gastosPessoais,
        aportes: DATA.aportes
      })
    });
    DATA.config.lastSync = new Date().toISOString();
    saveData();
    if(!silent) showToast('Sincronizado com o Sheets');
    if(state.sheet && state.sheet.name==='config') render();
  }catch(err){
    if(!silent) showToast('Falha ao sincronizar');
  }
}
function saveSheetsConfig(){
  const url = document.getElementById('f-sheeturl').value.trim();
  DATA.config = DATA.config||{};
  DATA.config.sheetsUrl = url;
  saveData(); showToast('URL salva'); render();
}

// ---------- Delete ----------
function deleteItem(kind, id){
  const map = {turno:'turnos', despesa:'despesasOperacionais', conta:'contasFixas', gasto:'gastosPessoais', aporte:'aportes'};
  const key = map[kind];
  if(!key) return;
  if(!confirm('Excluir este registro? Essa ação não pode ser desfeita.')) return;
  DATA[key] = DATA[key].filter(x=>x.id!==id);
  saveData(); render(); showToast('Excluído'); maybeSync();
}

// ---------- App State ----------
let state = { tab: 'visao', sheet: null };
const root = document.getElementById('root');

function setTab(t){ state.tab = t; state.sheet = null; render(); window.scrollTo(0,0); }
function openSheet(name, payload){ state.sheet = {name, payload}; render(); }
function closeSheet(){ state.sheet = null; render(); }

function showToast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = ICONS.check + `<span>${msg}</span>`;
  el.querySelector('svg').style.width='15px';
  el.querySelector('svg').style.flexShrink='0';
  document.body.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=> el.remove(), 300);
  }, 1800);
}

// ---------- Computations ----------
function computeTotals(){
  const turnosMes = DATA.turnos.filter(t => t.status==='concluido' && isThisMonth(t.data));
  const faturamento = turnosMes.reduce((s,t)=> s + turnoGanhos(t).total, 0);
  const kmRodados = turnosMes.reduce((s,t)=> s + Math.max(0,(Number(t.kmFinal||0)-Number(t.kmInicial||0))), 0);
  const despesasOpMes = DATA.despesasOperacionais.filter(d=>isThisMonth(d.data)).reduce((s,d)=>s+Number(d.valor||0),0);
  const gastosMes = DATA.gastosPessoais.filter(g=>isThisMonth(g.data)).reduce((s,g)=>s+Number(g.valor||0),0);
  const aportesMes = DATA.aportes.filter(a=>isThisMonth(a.data)).reduce((s,a)=>s+Number(a.valor||0),0);
  return {faturamento, kmRodados, despesasOpMes, gastosMes, aportesMes};
}

// ---------- Sheets (modals) ----------
function renderSheet(){
  if(!state.sheet) return `<div class="sheet-backdrop" onclick="closeSheet()"><div class="sheet"></div></div>`;
  const {name} = state.sheet;
  let title="", desc="", body="";

  if(name==='iniciarTurno'){
    title = "Iniciar turno";
    desc = "Informe a data e a quilometragem antes de sair.";
    body = `
      <div class="field"><label>Data do turno</label><input type="date" id="f-data" value="${todayISO()}"></div>
      <div class="field"><label>KM inicial</label><input type="number" id="f-km" placeholder="Ex: 45200" inputmode="numeric"></div>
      <div class="field"><label>Uber — acumulado agora no app (opcional)</label><input type="number" id="f-uberi" placeholder="Ex: 320,00" inputmode="decimal"></div>
      <div class="field"><label>99 — acumulado agora no app (opcional)</label><input type="number" id="f-novi" placeholder="Ex: 150,00" inputmode="decimal"></div>
      <p class="field-hint" style="margin:-6px 0 14px 0;">Informando esses valores, o app calcula sozinho o ganho do turno ao fechar — sem você precisar subtrair nada na mão.</p>
      <button class="btn btn-primary btn-block" onclick="submitIniciarTurno()">${ICONS.car}Iniciar turno</button>
    `;
  } else if(name==='finalizarTurno'){
    title = "Finalizar turno";
    desc = "Registre o KM final e os valores acumulados atuais de cada app.";
    const t = DATA.turnos.find(x=>x.status==='aberto');
    body = `
      <div class="field"><label>KM final</label><input type="number" id="f-kmfinal" placeholder="${t?t.kmInicial:0}" inputmode="numeric"></div>
      <div class="field">
        <label>Uber — acumulado agora no app</label>
        <input type="number" id="f-uberf" placeholder="Ex: 480,00" inputmode="decimal">
        <div class="field-hint">${t && t.uberAcumInicio!=null ? `Início do turno: ${brl(t.uberAcumInicio)}` : 'Sem valor inicial registrado — este valor será usado como o ganho total.'}</div>
      </div>
      <div class="field">
        <label>99 — acumulado agora no app</label>
        <input type="number" id="f-novf" placeholder="Ex: 210,00" inputmode="decimal">
        <div class="field-hint">${t && t.noventaNoveAcumInicio!=null ? `Início do turno: ${brl(t.noventaNoveAcumInicio)}` : 'Sem valor inicial registrado — este valor será usado como o ganho total.'}</div>
      </div>
      <div class="field"><label>Pix / Particular (total de corridas avulsas no período)</label><input type="number" id="f-pix" placeholder="0,00" inputmode="decimal"></div>
      <p class="field-hint" style="margin:-6px 0 14px 0;">O gasto com combustível é somado automaticamente das despesas rápidas lançadas durante este turno.</p>
      <button class="btn btn-primary btn-block" onclick="submitFinalizarTurno()">${ICONS.check}Salvar fechamento</button>
    `;
  } else if(name==='editarTurno'){
    const t = DATA.turnos.find(x=>x.id===state.sheet.payload);
    if(!t){ title="Editar turno"; body = `<div class="empty">Turno não encontrado.</div>`; }
    else{
      title = "Editar turno";
      desc = t.status==='aberto'
        ? "Ajuste os dados iniciais deste turno em andamento."
        : "Edite qualquer campo — as métricas são recalculadas automaticamente ao salvar.";
      body = `
        <div class="field"><label>Início</label><input type="datetime-local" id="f-edit-inicio" value="${toDatetimeLocal(t.horaInicio)}"></div>
        <div class="row2">
          <div class="field"><label>KM inicial</label><input type="number" id="f-edit-kmi" value="${t.kmInicial!=null?t.kmInicial:''}" inputmode="numeric"></div>
          <div class="field"><label>Uber início</label><input type="number" id="f-edit-uberi" value="${t.uberAcumInicio!=null?t.uberAcumInicio:''}" inputmode="decimal"></div>
        </div>
        <div class="field"><label>99 início</label><input type="number" id="f-edit-novi" value="${t.noventaNoveAcumInicio!=null?t.noventaNoveAcumInicio:''}" inputmode="decimal"></div>
        ${t.status==='concluido' ? `
          <div style="border-top:1px solid var(--border);margin:16px 0 14px 0;"></div>
          <div class="field"><label>Término</label><input type="datetime-local" id="f-edit-fim" value="${toDatetimeLocal(t.horaFim)}"></div>
          <div class="row2">
            <div class="field"><label>KM final</label><input type="number" id="f-edit-kmf" value="${t.kmFinal!=null?t.kmFinal:''}" inputmode="numeric"></div>
            <div class="field"><label>Uber final</label><input type="number" id="f-edit-uberf" value="${t.uberAcumFim!=null?t.uberAcumFim:''}" inputmode="decimal"></div>
          </div>
          <div class="row2">
            <div class="field"><label>99 final</label><input type="number" id="f-edit-novf" value="${t.noventaNoveAcumFim!=null?t.noventaNoveAcumFim:''}" inputmode="decimal"></div>
            <div class="field"><label>Pix / Particular</label><input type="number" id="f-edit-pix" value="${t.pix!=null?t.pix:''}" inputmode="decimal"></div>
          </div>
        ` : ''}
        <button class="btn btn-primary btn-block" onclick="submitEditarTurno('${t.id}')">${ICONS.check}Salvar alterações</button>
      `;
    }
  } else if(name==='resumoTurno'){
    const t = DATA.turnos.find(x=>x.id===state.sheet.payload);
    if(!t){ title="Resumo do turno"; body = `<div class="empty">Turno não encontrado.</div>`; }
    else{
      const g = turnoGanhos(t);
      const total = g.total;
      const km = Math.max(0, Number(t.kmFinal||0)-Number(t.kmInicial||0));
      const ms = (t.horaFim && t.horaInicio) ? (new Date(t.horaFim) - new Date(t.horaInicio)) : 0;
      const horas = ms/3600000;
      const valorPorKm = km>0 ? total/km : 0;
      const temHoras = horas > 0.0166;
      const valorPorHora = temHoras ? total/horas : 0;
      const combustivel = DATA.despesasOperacionais.filter(d=>d.turnoId===t.id).reduce((s,d)=>s+Number(d.valor||0),0);
      const liquido = total - combustivel;
      title = "Resumo do turno";
      desc = `Turno de ${fmtDate(t.data)} · ${t.kmInicial} → ${t.kmFinal} km`;
      body = `
        <div class="mini-cards" style="margin-bottom:10px;">
          <div class="card"><div class="label">Faturamento</div><div class="value">${brl(total)}</div></div>
          <div class="card"><div class="label">KM rodado</div><div class="value">${km} km</div></div>
        </div>
        <div class="mini-cards" style="margin-bottom:10px;">
          <div class="card"><div class="label">Uber</div><div class="value" style="font-size:15px;">${brl(g.uber)}</div></div>
          <div class="card"><div class="label">99</div><div class="value" style="font-size:15px;">${brl(g.noventaenove)}</div></div>
          <div class="card"><div class="label">Pix</div><div class="value" style="font-size:15px;">${brl(g.pix)}</div></div>
        </div>
        <div class="card">
          <div class="label">Valor por KM</div>
          <div class="value">${brl(valorPorKm)}</div>
        </div>
        <div class="card">
          <div class="label">Faturamento por hora</div>
          <div class="value">${temHoras ? brl(valorPorHora) : '—'}</div>
          <div class="hint">${temHoras ? 'Turno de ' + formatDuration(ms) : 'Duração muito curta para calcular'}</div>
        </div>
        <div class="card">
          <div class="label">Gasto com combustível</div>
          <div class="value">${brl(combustivel)}</div>
          <div class="hint">Somado das despesas rápidas deste turno</div>
        </div>
        <div class="card" style="border-color:var(--accent);">
          <div class="label">Líquido do turno</div>
          <div class="value" style="color:var(--accent);">${brl(liquido)}</div>
        </div>
        <button class="btn btn-secondary btn-block" style="margin-bottom:10px;" onclick="openSheet('editarTurno','${t.id}')">${ICONS.edit}Editar turno</button>
        <button class="btn btn-primary btn-block" onclick="closeSheet()">Fechar</button>
      `;
    }
  } else if(name==='config'){
    const cfg = DATA.config||{};
    title = "Sincronização com Google Sheets";
    desc = "Cole a URL do seu Apps Script para sincronizar os dados com uma planilha.";
    body = `
      <div class="field"><label>URL do Apps Script (Web App)</label><input type="url" id="f-sheeturl" placeholder="https://script.google.com/macros/s/.../exec" value="${cfg.sheetsUrl||''}"></div>
      <p style="color:var(--muted-2);font-size:12px;margin:-6px 0 16px 0;">${cfg.lastSync ? 'Última sincronização: '+new Date(cfg.lastSync).toLocaleString('pt-BR') : 'Ainda não sincronizado.'}</p>
      <button class="btn btn-primary btn-block" style="margin-bottom:10px;" onclick="saveSheetsConfig()">${ICONS.check}Salvar URL</button>
      <button class="btn btn-secondary btn-block" onclick="syncToSheets()">${ICONS.sync}Sincronizar agora</button>
    `;
  } else if(name==='despesaRapida'){
    title = "Registrar despesa";
    desc = "Lançamento rápido de combustível ou custo operacional.";
    body = `
      <div class="field"><label>Data</label><input type="date" id="f-data" value="${todayISO()}"></div>
      <div class="field"><label>Descrição</label><input type="text" id="f-desc" placeholder="Ex: Abastecimento"></div>
      <div class="field"><label>Valor</label><input type="number" id="f-valor" placeholder="0,00" inputmode="decimal"></div>
      <button class="btn btn-primary btn-block" onclick="submitDespesaRapida()">${ICONS.check}Salvar despesa</button>
    `;
  } else if(name==='contaFixa'){
    title = "Adicionar conta";
    desc = "Cadastre uma conta fixa para acompanhar o vencimento.";
    body = `
      <div class="field"><label>Nome</label><input type="text" id="f-nome" placeholder="Ex: Aluguel / Condomínio"></div>
      <div class="row2">
        <div class="field"><label>Valor</label><input type="number" id="f-valor" placeholder="0,00" inputmode="decimal"></div>
        <div class="field"><label>Dia do vencimento</label><input type="number" id="f-dia" placeholder="Ex: 10" min="1" max="31" inputmode="numeric"></div>
      </div>
      <button class="btn btn-primary btn-block" onclick="submitContaFixa()">${ICONS.check}Adicionar conta</button>
    `;
  } else if(name==='gasto'){
    title = "Registrar gasto";
    desc = "Lance uma despesa pessoal no extrato do mês.";
    const cats = ["Alimentação","Mercado","Lazer","Assinaturas","Farmácia","Transporte","Outros"];
    const formas = ["Débito","Crédito","Pix","Dinheiro"];
    body = `
      <div class="field"><label>Descrição</label><input type="text" id="f-desc" placeholder="Ex: Almoço na rua"></div>
      <div class="row2">
        <div class="field"><label>Valor</label><input type="number" id="f-valor" placeholder="0,00" inputmode="decimal"></div>
        <div class="field"><label>Data</label><input type="date" id="f-data" value="${todayISO()}"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Categoria</label><select id="f-cat">${cats.map(c=>`<option>${c}</option>`).join('')}</select></div>
        <div class="field"><label>Forma</label><select id="f-forma">${formas.map(f=>`<option>${f}</option>`).join('')}</select></div>
      </div>
      <button class="btn btn-primary btn-block" onclick="submitGasto()">${ICONS.check}Salvar gasto</button>
    `;
  } else if(name==='aporte'){
    title = "Registrar aporte";
    desc = "Guarde um novo aporte em reservas ou investimentos.";
    const tipos = ["Tesouro Selic","Tesouro IPCA+","CDB Liquidez Diária","FIIs (Renda Passiva)","Poupança","Outro"];
    body = `
      <div class="field"><label>Tipo</label><select id="f-tipo">${tipos.map(t=>`<option>${t}</option>`).join('')}</select></div>
      <div class="row2">
        <div class="field"><label>Valor</label><input type="number" id="f-valor" placeholder="0,00" inputmode="decimal"></div>
        <div class="field"><label>Data</label><input type="date" id="f-data" value="${todayISO()}"></div>
      </div>
      <button class="btn btn-primary btn-block" onclick="submitAporte()">${ICONS.check}Salvar aporte</button>
    `;
  }

  return `
    <div class="sheet-backdrop open" onclick="if(event.target===this)closeSheet()">
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-head"><h3>${title}</h3><button class="close" onclick="closeSheet()">${ICONS.x}</button></div>
        <p class="desc">${desc}</p>
        ${body}
      </div>
    </div>
  `;
}

// ---------- Submit handlers ----------
function submitIniciarTurno(){
  const data = document.getElementById('f-data').value || todayISO();
  const km = document.getElementById('f-km').value || 0;
  const uberIni = document.getElementById('f-uberi').value;
  const novIni = document.getElementById('f-novi').value;
  DATA.turnos.push({
    id:uid(), data, horaInicio:new Date().toISOString(), horaFim:null,
    kmInicial:Number(km), kmFinal:null,
    uberAcumInicio: uberIni===''? null : Number(uberIni),
    uberAcumFim: null,
    noventaNoveAcumInicio: novIni===''? null : Number(novIni),
    noventaNoveAcumFim: null,
    pix:0,
    status:'aberto'
  });
  saveData(); closeSheet(); setTab('trabalho'); showToast('Turno iniciado'); maybeSync();
}
function submitFinalizarTurno(){
  const t = DATA.turnos.find(x=>x.status==='aberto');
  if(!t) return closeSheet();
  t.kmFinal = Number(document.getElementById('f-kmfinal').value||t.kmInicial);
  const uberFim = document.getElementById('f-uberf').value;
  const novFim = document.getElementById('f-novf').value;
  t.uberAcumFim = uberFim===''? null : Number(uberFim);
  t.noventaNoveAcumFim = novFim===''? null : Number(novFim);
  t.pix = Number(document.getElementById('f-pix').value||0);
  t.horaFim = new Date().toISOString();
  t.status = 'concluido';
  saveData(); setTab('trabalho'); openSheet('resumoTurno', t.id); showToast('Turno finalizado'); maybeSync();
}
function submitEditarTurno(id){
  const t = DATA.turnos.find(x=>x.id===id);
  if(!t) return closeSheet();
  const inicioVal = document.getElementById('f-edit-inicio').value;
  if(inicioVal){ t.horaInicio = new Date(inicioVal).toISOString(); t.data = inicioVal.slice(0,10); }
  const kmi = document.getElementById('f-edit-kmi').value;
  if(kmi!=='') t.kmInicial = Number(kmi);
  const uberi = document.getElementById('f-edit-uberi').value;
  t.uberAcumInicio = uberi===''? null : Number(uberi);
  const novi = document.getElementById('f-edit-novi').value;
  t.noventaNoveAcumInicio = novi===''? null : Number(novi);

  if(t.status==='concluido'){
    const fimVal = document.getElementById('f-edit-fim').value;
    if(fimVal) t.horaFim = new Date(fimVal).toISOString();
    const kmf = document.getElementById('f-edit-kmf').value;
    if(kmf!=='') t.kmFinal = Number(kmf);
    const uberf = document.getElementById('f-edit-uberf').value;
    t.uberAcumFim = uberf===''? null : Number(uberf);
    const novf = document.getElementById('f-edit-novf').value;
    t.noventaNoveAcumFim = novf===''? null : Number(novf);
    t.pix = Number(document.getElementById('f-edit-pix').value||0);
    // migrate away from legacy direct-value fields now that accumulated schema is in use
    delete t.uber; delete t.noventaenove;
  }
  saveData(); showToast('Turno atualizado'); maybeSync();
  if(t.status==='concluido'){ openSheet('resumoTurno', t.id); } else { closeSheet(); render(); }
}
function submitDespesaRapida(){
  const data = document.getElementById('f-data').value || todayISO();
  const desc = document.getElementById('f-desc').value || 'Despesa';
  const valor = Number(document.getElementById('f-valor').value||0);
  const turnoAberto = DATA.turnos.find(x=>x.status==='aberto');
  DATA.despesasOperacionais.push({id:uid(), data, hora:new Date().toISOString(), descricao:desc, valor, turnoId: turnoAberto ? turnoAberto.id : null});
  saveData(); closeSheet(); render(); showToast('Despesa registrada'); maybeSync();
}
function submitContaFixa(){
  const nome = document.getElementById('f-nome').value || 'Conta';
  const valor = Number(document.getElementById('f-valor').value||0);
  const dia = Number(document.getElementById('f-dia').value||1);
  DATA.contasFixas.push({id:uid(), nome, valor, dia, pago:false});
  saveData(); closeSheet(); render(); showToast('Conta adicionada'); maybeSync();
}
function togglePago(id){
  const c = DATA.contasFixas.find(x=>x.id===id);
  if(c){ c.pago = !c.pago; saveData(); render(); maybeSync(); }
}
function marcarTodasPagas(){
  DATA.contasFixas.forEach(c=>c.pago=true);
  saveData(); render(); showToast('Todas marcadas como pagas'); maybeSync();
}
function setContasFilter(f){ state.contasFilter = f; render(); }
function submitGasto(){
  const desc = document.getElementById('f-desc').value || 'Gasto';
  const valor = Number(document.getElementById('f-valor').value||0);
  const data = document.getElementById('f-data').value || todayISO();
  const categoria = document.getElementById('f-cat').value;
  const forma = document.getElementById('f-forma').value;
  DATA.gastosPessoais.push({id:uid(), descricao:desc, valor, data, categoria, forma});
  saveData(); closeSheet(); render(); showToast('Gasto registrado'); maybeSync();
}
function submitAporte(){
  const nome = document.getElementById('f-tipo').value;
  const valor = Number(document.getElementById('f-valor').value||0);
  const data = document.getElementById('f-data').value || todayISO();
  DATA.aportes.push({id:uid(), nome, valor, data});
  saveData(); closeSheet(); render(); showToast('Aporte registrado'); maybeSync();
}

// ---------- Main render ----------
const TITLES = {
  visao: {h:'Visão geral', s:null},
  trabalho: {h:'Trabalho no carro', s:null},
  contas: {h:'Contas fixas', s:null},
  gastos: {h:'Gastos pessoais', s:null},
  reservas: {h:'Reservas', s:null},
};

function render(){
  const t = TITLES[state.tab];
  let content = '';
  if(state.tab==='visao') content = renderVisao();
  else if(state.tab==='trabalho') content = renderTrabalho();
  else if(state.tab==='contas') content = renderContas();
  else if(state.tab==='gastos') content = renderGastos();
  else if(state.tab==='reservas') content = renderReservas();

  root.innerHTML = `
    <div class="status-spacer"></div>
    <header class="topbar">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
        <h1>${t.h}</h1>
        <button class="gear-btn" onclick="openSheet('config')">${ICONS.gear}</button>
      </div>
    </header>
    <main>${content}</main>
    ${renderTabbar()}
    ${renderSheet()}
  `;
}

render();

// Register service worker for offline installability
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
